<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec gradient léger -->
  <rect width="600" height="400" rx="20" fill="#E8F5E9"/>
  
  <!-- Soleil -->
  <circle cx="500" cy="80" r="40" fill="#FFC107"/>
  <circle cx="500" cy="80" r="50" fill="#FFC107" fill-opacity="0.3"/>
  <circle cx="500" cy="80" r="60" fill="#FFC107" fill-opacity="0.1"/>
  
  <!-- Collines -->
  <path d="M0 300C100 250 150 280 250 260C350 240 400 300 500 280C600 260 600 400 600 400H0V300Z" fill="#8BC34A"/>
  <path d="M0 320C80 290 180 310 280 290C380 270 450 320 550 300C650 280 600 400 600 400H0V320Z" fill="#4CAF50"/>
  <path d="M0 340C100 320 200 330 300 320C400 310 550 350 600 330V400H0V340Z" fill="#2E7D32"/>
  
  <!-- Champ quadrillé -->
  <g opacity="0.8">
    <!-- Lignes verticales -->
    <line x1="100" y1="320" x2="100" y2="400" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="150" y1="320" x2="150" y2="400" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="200" y1="320" x2="200" y2="400" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="250" y1="320" x2="250" y2="400" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="300" y1="320" x2="300" y2="400" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="350" y1="320" x2="350" y2="400" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="400" y1="320" x2="400" y2="400" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="450" y1="320" x2="450" y2="400" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="500" y1="320" x2="500" y2="400" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="550" y1="320" x2="550" y2="400" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Lignes horizontales -->
    <line x1="0" y1="340" x2="600" y2="340" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="360" x2="600" y2="360" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="380" x2="600" y2="380" stroke="#1B5E20" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Arbres -->
  <g transform="translate(50, 240) scale(0.7)">
    <path d="M0 0L20 -60L40 0H0Z" fill="#2E7D32"/>
    <path d="M10 0L30 -50L50 0H10Z" fill="#388E3C"/>
    <rect x="15" y="0" width="10" height="20" fill="#795548"/>
  </g>
  
  <g transform="translate(420, 220) scale(0.9)">
    <path d="M0 0L20 -60L40 0H0Z" fill="#2E7D32"/>
    <path d="M10 0L30 -50L50 0H10Z" fill="#388E3C"/>
    <rect x="15" y="0" width="10" height="20" fill="#795548"/>
  </g>
  
  <g transform="translate(500, 240) scale(0.6)">
    <path d="M0 0L20 -60L40 0H0Z" fill="#2E7D32"/>
    <path d="M10 0L30 -50L50 0H10Z" fill="#388E3C"/>
    <rect x="15" y="0" width="10" height="20" fill="#795548"/>
  </g>
  
  <!-- Plantes de différentes tailles -->
  <g transform="translate(150, 320)">
    <path d="M0 0C0 0 -10 -30 0 -40C10 -30 0 0 0 0Z" fill="#4CAF50"/>
    <path d="M0 0C0 0 10 -20 0 -30C-10 -20 0 0 0 0Z" fill="#8BC34A"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#795548" stroke-width="2"/>
  </g>
  
  <g transform="translate(200, 320)">
    <path d="M0 0C0 0 -15 -40 0 -50C15 -40 0 0 0 0Z" fill="#4CAF50"/>
    <path d="M0 0C0 0 15 -30 0 -40C-15 -30 0 0 0 0Z" fill="#8BC34A"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#795548" stroke-width="2"/>
  </g>
  
  <g transform="translate(250, 320)">
    <path d="M0 0C0 0 -10 -30 0 -40C10 -30 0 0 0 0Z" fill="#4CAF50"/>
    <path d="M0 0C0 0 10 -20 0 -30C-10 -20 0 0 0 0Z" fill="#8BC34A"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#795548" stroke-width="2"/>
  </g>
  
  <g transform="translate(300, 320)">
    <path d="M0 0C0 0 -15 -40 0 -50C15 -40 0 0 0 0Z" fill="#4CAF50"/>
    <path d="M0 0C0 0 15 -30 0 -40C-15 -30 0 0 0 0Z" fill="#8BC34A"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#795548" stroke-width="2"/>
  </g>
  
  <g transform="translate(350, 320)">
    <path d="M0 0C0 0 -10 -20 0 -30C10 -20 0 0 0 0Z" fill="#4CAF50"/>
    <path d="M0 0C0 0 10 -15 0 -25C-10 -15 0 0 0 0Z" fill="#8BC34A"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#795548" stroke-width="2"/>
  </g>
  
  <!-- Tablette/écran avec interface AgriFlow -->
  <g transform="translate(180, 120)">
    <!-- Tablette -->
    <rect x="0" y="0" width="240" height="180" rx="10" fill="#455A64"/>
    <rect x="10" y="10" width="220" height="160" rx="5" fill="#FFFFFF"/>
    
    <!-- Écran d'interface -->
    <rect x="20" y="20" width="200" height="30" rx="5" fill="#2E7D32"/>
    <circle cx="35" cy="35" r="7" fill="#FFFFFF"/>
    <rect x="50" y="30" width="80" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="150" y="30" width="50" height="10" rx="5" fill="#FFFFFF"/>
    
    <!-- Contenu -->
    <rect x="20" y="60" width="60" height="60" rx="5" fill="#E8F5E9"/>
    <rect x="90" y="60" width="60" height="60" rx="5" fill="#E8F5E9"/>
    <rect x="160" y="60" width="60" height="60" rx="5" fill="#E8F5E9"/>
    
    <!-- Icônes stylisées -->
    <circle cx="50" cy="80" r="15" fill="#4CAF50"/>
    <circle cx="120" cy="80" r="15" fill="#8BC34A"/>
    <rect x="175" y="70" width="30" height="20" rx="5" fill="#2E7D32"/>
    
    <!-- Texte stylisé -->
    <rect x="30" y="100" width="40" height="5" rx="2" fill="#263238"/>
    <rect x="30" y="110" width="30" height="5" rx="2" fill="#263238"/>
    
    <rect x="100" y="100" width="40" height="5" rx="2" fill="#263238"/>
    <rect x="100" y="110" width="30" height="5" rx="2" fill="#263238"/>
    
    <rect x="170" y="100" width="40" height="5" rx="2" fill="#263238"/>
    <rect x="170" y="110" width="30" height="5" rx="2" fill="#263238"/>
    
    <!-- Barre de bas -->
    <rect x="20" y="130" width="200" height="30" rx="5" fill="#F5F5F5"/>
    <rect x="30" y="142.5" width="40" height="5" rx="2" fill="#2E7D32"/>
    <rect x="90" y="142.5" width="40" height="5" rx="2" fill="#4CAF50"/>
    <rect x="150" y="142.5" width="40" height="5" rx="2" fill="#8BC34A"/>
  </g>
  
  <!-- Logo AgriFlow -->
  <g transform="translate(320, 40)">
    <circle cx="0" cy="0" r="25" fill="#2E7D32"/>
    <path d="M0 -15C0 -15 -10 -5 -10 5C-10 10 -5 15 0 15C5 15 10 10 10 5C10 -5 0 -15 0 -15Z" fill="#8BC34A" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M0 15V25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 25C0 25 -5 20 -5 17.5C-5 15 -2.5 12.5 0 12.5C2.5 12.5 5 15 5 17.5C5 20 0 25 0 25Z" fill="#4CAF50" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  
  <!-- Nuages stylisés -->
  <g opacity="0.9">
    <ellipse cx="100" cy="70" rx="30" ry="20" fill="white"/>
    <ellipse cx="130" cy="60" rx="25" ry="15" fill="white"/>
    <ellipse cx="160" cy="70" rx="20" ry="15" fill="white"/>
  </g>
  
  <g opacity="0.7">
    <ellipse cx="400" cy="100" rx="25" ry="15" fill="white"/>
    <ellipse cx="430" cy="90" rx="20" ry="10" fill="white"/>
    <ellipse cx="450" cy="100" rx="15" ry="10" fill="white"/>
  </g>
</svg> 