<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec grid pattern -->
  <rect width="600" height="400" rx="20" fill="#F9FAFB"/>
  <g opacity="0.1">
    <path d="M0 50H600" stroke="#2E7D32" stroke-width="1"/>
    <path d="M0 100H600" stroke="#2E7D32" stroke-width="1"/>
    <path d="M0 150H600" stroke="#2E7D32" stroke-width="1"/>
    <path d="M0 200H600" stroke="#2E7D32" stroke-width="1"/>
    <path d="M0 250H600" stroke="#2E7D32" stroke-width="1"/>
    <path d="M0 300H600" stroke="#2E7D32" stroke-width="1"/>
    <path d="M0 350H600" stroke="#2E7D32" stroke-width="1"/>
    
    <path d="M50 0V400" stroke="#2E7D32" stroke-width="1"/>
    <path d="M100 0V400" stroke="#2E7D32" stroke-width="1"/>
    <path d="M150 0V400" stroke="#2E7D32" stroke-width="1"/>
    <path d="M200 0V400" stroke="#2E7D32" stroke-width="1"/>
    <path d="M250 0V400" stroke="#2E7D32" stroke-width="1"/>
    <path d="M300 0V400" stroke="#2E7D32" stroke-width="1"/>
    <path d="M350 0V400" stroke="#2E7D32" stroke-width="1"/>
    <path d="M400 0V400" stroke="#2E7D32" stroke-width="1"/>
    <path d="M450 0V400" stroke="#2E7D32" stroke-width="1"/>
    <path d="M500 0V400" stroke="#2E7D32" stroke-width="1"/>
    <path d="M550 0V400" stroke="#2E7D32" stroke-width="1"/>
  </g>
  
  <!-- Ordinateur portable stylisé avec AgriFlow -->
  <g transform="translate(300, 200)">
    <!-- Base de l'ordinateur -->
    <path d="M-120 60H120L100 80H-100L-120 60Z" fill="#455A64"/>
    
    <!-- Écran et clavier -->
    <rect x="-100" y="-60" width="200" height="120" rx="5" fill="#455A64"/>
    <rect x="-95" y="-55" width="190" height="110" rx="3" fill="#FFFFFF"/>
    
    <!-- Écran d'AgriFlow -->
    <rect x="-90" y="-50" width="180" height="25" rx="3" fill="#2E7D32"/>
    <circle cx="-80" cy="-37.5" r="5" fill="white"/>
    <path d="M-70 -37.5H-20" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M60 -45H80" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M60 -37.5H70" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M60 -30H75" stroke="white" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Contenu de l'écran -->
    <g transform="translate(0, 0)">
      <!-- Carte dans l'application -->
      <rect x="-90" y="-20" width="80" height="70" rx="3" fill="#E8F5E9"/>
      <path d="M-80 0C-80 0 -70 -15 -60 0C-50 15 -40 0 -40 0" stroke="#4CAF50" stroke-width="2"/>
      <path d="M-80 10C-80 10 -70 -5 -60 10C-50 25 -40 10 -40 10" stroke="#81C784" stroke-width="2"/>
      <circle cx="-60" cy="10" r="5" fill="#FF5722" opacity="0.7"/>
      <circle cx="-60" cy="10" r="2" fill="white"/>
      
      <!-- Sections -->
      <rect x="0" y="-20" width="80" height="30" rx="3" fill="#E8F5E9"/>
      <rect x="0" y="20" width="80" height="30" rx="3" fill="#E8F5E9"/>
      
      <!-- Données dans les sections -->
      <circle cx="15" cy="-5" r="8" fill="#4CAF50"/>
      <rect x="30" y="-10" width="40" height="5" rx="2.5" fill="#263238" opacity="0.7"/>
      <rect x="30" y="0" width="30" height="5" rx="2.5" fill="#263238" opacity="0.7"/>
      
      <path d="M10 30L20 35L30 25L40 40" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="50" y="30" width="20" height="10" rx="3" fill="#4CAF50" opacity="0.3"/>
    </g>
  </g>
  
  <!-- Icônes de fonctionnalités -->
  <!-- 1. Gestion des terres -->
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="40" fill="#E8F5E9"/>
    <path d="M-25 -15H25V15H-25V-15Z" stroke="#2E7D32" stroke-width="2" fill="none"/>
    <path d="M-25 -5H25" stroke="#2E7D32" stroke-width="2"/>
    <path d="M-15 -15V15" stroke="#2E7D32" stroke-width="2"/>
    <path d="M-5 -5L-5 15" stroke="#2E7D32" stroke-width="2"/>
    <path d="M5 -5L5 15" stroke="#2E7D32" stroke-width="2"/>
    <path d="M15 -5L15 15" stroke="#2E7D32" stroke-width="2"/>
    <circle cx="-10" cy="-10" r="3" fill="#4CAF50"/>
  </g>
  
  <!-- 2. Suivi des cultures -->
  <g transform="translate(450, 100)">
    <circle cx="0" cy="0" r="40" fill="#E8F5E9"/>
    <path d="M-20 0C-20 0 -10 -20 0 0C10 20 20 0 20 0" stroke="#2E7D32" stroke-width="2" fill="none"/>
    <path d="M-20 10C-20 10 -10 -10 0 10C10 30 20 10 20 10" stroke="#2E7D32" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="5" fill="#4CAF50"/>
    <circle cx="0" cy="0" r="2" fill="white"/>
  </g>
  
  <!-- 3. Actions agricoles -->
  <g transform="translate(150, 300)">
    <circle cx="0" cy="0" r="40" fill="#E8F5E9"/>
    <rect x="-15" y="-20" width="30" height="10" rx="2" fill="#795548"/>
    <path d="M-5 -20V-30" stroke="#795548" stroke-width="2"/>
    <path d="M5 -20V-30" stroke="#795548" stroke-width="2"/>
    <path d="M0 -10V10" stroke="#2E7D32" stroke-width="3"/>
    <path d="M-15 0L-5 10L5 0L15 10" stroke="#4CAF50" stroke-width="2" fill="none"/>
  </g>
  
  <!-- 4. Calendrier interactif -->
  <g transform="translate(450, 300)">
    <circle cx="0" cy="0" r="40" fill="#E8F5E9"/>
    <rect x="-20" y="-20" width="40" height="40" rx="3" fill="none" stroke="#2E7D32" stroke-width="2"/>
    <path d="M-20 -10H20" stroke="#2E7D32" stroke-width="2"/>
    <path d="M-20 0H20" stroke="#2E7D32" stroke-width="2"/>
    <path d="M-20 10H20" stroke="#2E7D32" stroke-width="2"/>
    <path d="M-10 -20V20" stroke="#2E7D32" stroke-width="2"/>
    <path d="M0 -20V20" stroke="#2E7D32" stroke-width="2"/>
    <path d="M10 -20V20" stroke="#2E7D32" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#4CAF50"/>
  </g>
  
  <!-- 5. Observations et suivi -->
  <g transform="translate(75, 200)">
    <circle cx="0" cy="0" r="40" fill="#E8F5E9"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#2E7D32" stroke-width="2"/>
    <path d="M15 15L25 25" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
    <path d="M-7 -7L7 7" stroke="#4CAF50" stroke-width="2"/>
    <path d="M-7 7L7 -7" stroke="#4CAF50" stroke-width="2"/>
  </g>
  
  <!-- 6. Collaboration -->
  <g transform="translate(525, 200)">
    <circle cx="0" cy="0" r="40" fill="#E8F5E9"/>
    <circle cx="-15" cy="-10" r="10" fill="none" stroke="#2E7D32" stroke-width="2"/>
    <circle cx="15" cy="-10" r="10" fill="none" stroke="#2E7D32" stroke-width="2"/>
    <circle cx="0" cy="15" r="10" fill="none" stroke="#2E7D32" stroke-width="2"/>
    <path d="M-10 -3L-5 10" stroke="#2E7D32" stroke-width="2"/>
    <path d="M10 -3L5 10" stroke="#2E7D32" stroke-width="2"/>
  </g>
  
  <!-- Lignes de connexion entre les icônes -->
  <g stroke="#4CAF50" stroke-width="2" stroke-dasharray="5,5" opacity="0.7">
    <path d="M150 140L300 160"/>
    <path d="M450 140L300 160"/>
    <path d="M150 260L300 240"/>
    <path d="M450 260L300 240"/>
    <path d="M115 200L180 200"/>
    <path d="M485 200L420 200"/>
    <path d="M190 100L410 100"/>
    <path d="M190 300L410 300"/>
  </g>
  
  <!-- Éléments décoratifs -->
  <!-- Plants stylisés -->
  <g transform="translate(30, 70)">
    <path d="M0 0C0 0 -10 -30 0 -50C10 -30 0 0 0 0Z" fill="#2E7D32" opacity="0.9"/>
    <path d="M0 0C0 0 10 -20 0 -40C-10 -20 0 0 0 0Z" fill="#4CAF50" opacity="0.9"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#795548" stroke-width="2"/>
  </g>
  
  <g transform="translate(570, 70)">
    <path d="M0 0C0 0 -10 -30 0 -50C10 -30 0 0 0 0Z" fill="#2E7D32" opacity="0.9"/>
    <path d="M0 0C0 0 10 -20 0 -40C-10 -20 0 0 0 0Z" fill="#4CAF50" opacity="0.9"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#795548" stroke-width="2"/>
  </g>
  
  <g transform="translate(30, 330)">
    <path d="M0 0C0 0 -10 -30 0 -50C10 -30 0 0 0 0Z" fill="#2E7D32" opacity="0.9"/>
    <path d="M0 0C0 0 10 -20 0 -40C-10 -20 0 0 0 0Z" fill="#4CAF50" opacity="0.9"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#795548" stroke-width="2"/>
  </g>
  
  <g transform="translate(570, 330)">
    <path d="M0 0C0 0 -10 -30 0 -50C10 -30 0 0 0 0Z" fill="#2E7D32" opacity="0.9"/>
    <path d="M0 0C0 0 10 -20 0 -40C-10 -20 0 0 0 0Z" fill="#4CAF50" opacity="0.9"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#795548" stroke-width="2"/>
  </g>
  
  <!-- Logo AgriFlow au centre -->
  <g transform="translate(300, 40)">
    <path d="M-50 0A50 50 0 0 1 50 0" stroke="#2E7D32" stroke-width="4" fill="none"/>
    <path d="M-40 0A40 40 0 0 1 40 0" stroke="#4CAF50" stroke-width="3" fill="none"/>
    <circle cx="0" cy="0" r="15" fill="#4CAF50"/>
    <path d="M-5 -5L5 5M-5 5L5 -5" stroke="white" stroke-width="2"/>
  </g>
</svg> 