version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriflow-frontend
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "4321:4321" # Port principal d'Astro
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4321
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
